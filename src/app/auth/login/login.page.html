<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <ion-list>
      <ion-item>
        <ion-input
          formControlName="email"
          type="email"
          label="Email"
          labelPlacement="stacked"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          formControlName="bib"
          type="number"
          label="Bib Number"
          labelPlacement="stacked"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" [disabled]="form.invalid"
        >Sign In</ion-button
      >
    </ion-list>
  </form>
</ion-content>
