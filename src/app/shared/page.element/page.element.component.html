@switch (element.type) {
  @case ("tracking") {
    <app-tracking [trackingElementModel]="element"></app-tracking>
  }
  @case ("news") {
    <app-news [newsElementModel]="element"></app-news>
  }
  @case ("info") {
    <app-info
      [infoChildElementModelArray]="element.infoChildElements"
    ></app-info>
  }
  @case ("countdowntimer") {
    <app-countdowntimer
      [countdownTimerElementModel]="element"
    ></app-countdowntimer>
  }
  @case ("contentimage") {
    <app-content-image [contentImageElementModel]="element"></app-content-image>
  }
  @case ("link") {
    <app-link [linkElementModel]="element"></app-link>
  }
  @case ("selfie") {
    <app-selfie [selfieElementModel]="element"></app-selfie>
  }
  @default {
    <!-- Unknown element type from the CMS: render nothing rather than
         leaking an untranslated developer string to users. -->
  }
}
