<button
  type="button"
  #infoChildElement
  class="info-child-element"
  (click)="navigateToInfo()"
>
  <div class="title-row">
    <div class="title-column">
      <span class="subtitle">{{ infoChildElementModel?.subtitle }}</span>
      <span class="title">{{ infoChildElementModel?.title }}</span>
    </div>
    <div class="arrow-column">
      <ion-icon name="chevron-forward-outline" class="right-arrow"></ion-icon>
    </div>
  </div>
</button>
