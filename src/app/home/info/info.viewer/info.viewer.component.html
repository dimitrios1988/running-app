<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ (info$ | async)?.title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (info$ | async; as data) { @if (data.image?.trim()) {
  <div class="image-container app-media">
    <img [src]="data.image" alt="" loading="lazy" />
  </div>
  } @if (data.link?.trim()) {
  <div class="link-container">
    <ion-button expand="block" (click)="navigateToLink(data.link)">
      {{ "INFO_VIEWER.MORE_INFO" | translate }}
    </ion-button>
  </div>
  }

  <div class="info-description app-prose" [innerHTML]="data.safeContent"></div>
  }
</ion-content>
