<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title> {{ "TRACKING_VIEWER.TRACKING" | translate }} </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        {{ "TRACKING_VIEWER.TRACKING" | translate }}
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="tracking-viewer-container">
    <iframe [src]="sanitizedUrl" width="100%" height="100%" title="Tracking viewer"></iframe>
  </div>
</ion-content>
