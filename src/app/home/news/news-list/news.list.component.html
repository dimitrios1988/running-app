<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "NEWS_LIST.TITLE" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="virtual-wrapper">
  <ion-refresher
    slot="fixed"
    [disabled]="!isAtTop()"
    (ionRefresh)="doRefresh($event)"
  >
    <ion-refresher-content
      pullingText="{{ 'NEWS_LIST.PULLING_TEXT' | translate }}"
      pullingIcon="chevron-down-circle-outline"
      refreshingSpinner="circles"
      refreshingText="{{ 'NEWS_LIST.REFRESHING_TEXT' | translate }}"
    />
  </ion-refresher>
  <cdk-virtual-scroll-viewport
    class="scroll-viewport"
    itemSize="300"
    (scrolledIndexChange)="onScroll()"
  >
    <ion-card
      *cdkVirtualFor="let item of newsListItems"
      class="news-list-item"
      (click)="openNewsItem(item)"
    >
      <div
        class="featured-image-container"
        [style.background-image]="'url(' + item.featuredImageUrl + ')'"
      ></div>

      <ion-card-header>
        <ion-card-title>{{ item.title }}</ion-card-title>
        <ion-card-subtitle>{{ item.excerpt }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        {{ item.publishedDate | date: "medium" }}
      </ion-card-content>
    </ion-card>
  </cdk-virtual-scroll-viewport>
</ion-content>
