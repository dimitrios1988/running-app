<button
  type="button"
  #newsElement
  class="news-element"
  (click)="navigateToNews()"
>
  <img
    [src]="newsElementModel.backgroundImage"
    alt="News Header Image"
    class="background-image"
  />
  <div class="title-row">
    <div class="icon-column">
      <img #newsIcon [src]="newsElementModel.icon" width="32" alt="" />
    </div>
    <div class="title-column">
      <span class="title">{{ newsElementModel.title }}</span>
      <span class="subtitle">{{ newsElementModel.subtitle }}</span>
    </div>
    <div class="arrow-column">
      <ion-icon
        name="chevron-forward-outline"
        aria-hidden="true"
        class="right-arrow"
      ></ion-icon>
    </div>
  </div>
</button>
