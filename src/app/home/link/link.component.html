<button
  type="button"
  class="link-element app-card app-pressable"
  (click)="navigateToLink(linkElementModel.url)"
  [attr.aria-label]="linkElementModel.title"
>
  <div class="title-row">
    <div class="icon-column" aria-hidden="true">
      @if (linkElementModel.icon) {
        <img
          [appCachedSrc]="linkElementModel.icon"
          width="32"
          height="32"
          [alt]="linkElementModel.title"
        />
      }
    </div>

    <div class="title-column">
      <span class="title app-clamp-2">{{ linkElementModel.title }}</span>
    </div>

    <div class="arrow-column" aria-hidden="true">
      <ion-icon name="chevron-forward-outline" class="right-arrow"></ion-icon>
    </div>
  </div>
</button>
