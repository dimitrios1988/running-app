<div class="countdown-timer-element">
  <h4>{{ title }}</h4>
  <p>Countdown to {{ targetDate | date : "mediumDate" }}</p>

  <div class="wrapper">
    <div class="description" aria-hidden="true">
      <p>Days</p>
      <p>Hours</p>
      <p>Minutes</p>
      <p>Seconds</p>
    </div>

    @if(time$ | async; as t){
    <div class="times" role="timer" aria-live="polite">
      <p>{{ formatTwo(t.days) }}</p>
      <p>{{ formatTwo(t.hours) }}</p>
      <p>{{ formatTwo(t.minutes) }}</p>
      <p>{{ formatTwo(t.seconds) }}</p>
    </div>
    }
  </div>
</div>
