<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <!-- Full-frame border. Authored at 3:4 to match the camera stage. -->
  <defs>
    <linearGradient id="rf-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b2b" stop-opacity="0" />
      <stop offset="1" stop-color="#0b1b2b" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect x="18" y="18" width="1044" height="1404" rx="36" ry="36"
        fill="none" stroke="#c2410c" stroke-width="36" />
  <rect x="52" y="52" width="976" height="1336" rx="18" ry="18"
        fill="none" stroke="#ffffff" stroke-width="5" opacity="0.9" />

  <rect x="36" y="1140" width="1008" height="264" fill="url(#rf-bottom)" />
  <text x="540" y="1300" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="88"
        font-weight="bold" letter-spacing="10" fill="#ffffff">WE ALL RUN</text>
</svg>
